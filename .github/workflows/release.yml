name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.10"
      - run: uv sync --locked --extra dev
      - name: tag equals source version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC="$(uv run --locked python -c 'import stonepy; print(stonepy.__version__)')"
          test "$TAG" = "$SRC" || { echo "tag $TAG != __version__ $SRC" >&2; exit 1; }
      - run: uv build
      - run: uv run --locked twine check dist/*
      - run: uv run --locked python scripts/check_release_artifacts.py dist --source-version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
