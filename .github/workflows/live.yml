name: live
# Contract tests against the real CIAPI demo account. Runs nightly and on demand only - never on
# pull requests, so the paper-account secrets are never exposed to fork PR workflows. A failure
# here may mean an endpoint drifted from the client, but can also be a credentials, demo-API
# availability, runner, or test-harness problem; xfailed model mismatches are tracked in #24.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    if: github.repository == 'aaronmgn/stonepy'
    runs-on: ubuntu-latest
    env:
      STONEX_LIVE: "1"
      STONEX_LIVE_CLIENT_ACCOUNT_ID: ${{ vars.STONEX_LIVE_CLIENT_ACCOUNT_ID }}
      STONEX_USERNAME: ${{ secrets.STONEX_USERNAME }}
      STONEX_PASSWORD: ${{ secrets.STONEX_PASSWORD }}
      STONEX_APP_KEY: ${{ secrets.STONEX_APP_KEY }}
      STONEX_BASE_URL: ${{ vars.STONEX_BASE_URL }}
      # Opt-in gate for the SaveOrder simulation probe (tests/live/test_live_contract_probes.py):
      # set the STONEX_LIVE_ORDER_PROBE repository variable to "1" to enable it.
      STONEX_LIVE_ORDER_PROBE: ${{ vars.STONEX_LIVE_ORDER_PROBE }}
      STONEX_LIVE_SAVE_PA_PROBE: ${{ vars.STONEX_LIVE_SAVE_PA_PROBE }}
      STONEX_LIVE_MESSAGE_UPDATE_PROBE: ${{ vars.STONEX_LIVE_MESSAGE_UPDATE_PROBE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - run: uv python install 3.13
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run --locked pytest tests/live -m live -p no:cov -rA
