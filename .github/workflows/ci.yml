name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          cache-suffix: ${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked python scripts/consistency_lint.py
      - run: uv run --locked pytest --cov -m "not pyright"
      - run: uv build
      - run: uv run --locked twine check dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - run: uv sync --locked --extra docs
      - run: uv run --locked mkdocs build --strict

  generated-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - name: client regeneration drift gate
        run: |
          uv run --locked python -m stonepy._generator client
          git diff --exit-code -- src/stonepy/client.py src/stonepy/resources
          test -z "$(git status --porcelain --untracked-files=all -- src/stonepy/client.py src/stonepy/resources)"

  lowest-direct:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          cache-suffix: lowest-${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }} .venv-lowest
      - name: Make runtime dependencies direct requirements
        run: |
          .venv-lowest/bin/python -c 'import tomllib; from pathlib import Path; project = tomllib.loads(Path("pyproject.toml").read_text())["project"]; Path("/tmp/stonepy-lowest-requirements.txt").write_text("\n".join(project["dependencies"]) + "\n")'
      - run: uv pip install --python .venv-lowest --resolution lowest-direct --upgrade -r /tmp/stonepy-lowest-requirements.txt "pytest>=9.1.1" "pytest-cov>=5" "respx>=0.21"
      - run: uv pip install --python .venv-lowest --no-deps .
      - run: .venv-lowest/bin/python -m pip list 2>/dev/null || uv pip list --python .venv-lowest
      - name: Verify pydantic floor
        run: |
          .venv-lowest/bin/python - <<'PY'
          import sys
          from importlib.metadata import version

          expected = "2.12." if sys.version_info >= (3, 14) else "2.7."
          installed = version("pydantic")
          assert installed.startswith(expected), f"Expected pydantic {expected}x, got {installed}"
          PY
      - run: .venv-lowest/bin/python -m pytest -p no:cacheprovider --ignore=tests/generator --ignore=tests/live

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv build
      - run: uv run --locked python scripts/check_release_artifacts.py dist --source-version "$(uv run --locked python -c 'import stonepy; print(stonepy.__version__)')"
      - run: python3 -m venv /tmp/stonepy-wheel-smoke
      - run: /tmp/stonepy-wheel-smoke/bin/pip install dist/*.whl "respx>=0.21" "pytest>=9.1.1"
      - run: cp -R tests/smoke_installed/. /tmp/stonepy-wheel-smoke/
      - run: cd /tmp/stonepy-wheel-smoke && env -u PYTHONPATH STONEPY_SMOKE_INSTALLED=1 ./bin/python -m pytest . --ignore=lib --ignore=lib64 -p no:cacheprovider -q
      - name: Test extracted source distribution offline
        env:
          STONEX_LIVE: "0"
        run: |
          sdist_dir="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$sdist_dir" --strip-components=1
          cd "$sdist_dir"
          unset PYTHONPATH VIRTUAL_ENV UV_PROJECT_ENVIRONMENT STONEPY_CATALOG STONEPY_SMOKE_INSTALLED
          uv sync --locked --extra dev --python 3.12
          uv run --offline --no-sync pytest -q -p no:cacheprovider -m "not pyright"

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --locked pyright src tests
      - run: uv run --locked python -m mypy.stubtest stonepy.models
      - run: uv run --locked pytest -q -p no:cacheprovider -m pyright tests/test_consumer_typing.py

  ci:
    if: always()
    needs: [test, docs, generated-client, lowest-direct, wheel-smoke, pyright]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.docs.result }}" = success
          test "${{ needs.generated-client.result }}" = success
          test "${{ needs.lowest-direct.result }}" = success
          test "${{ needs.wheel-smoke.result }}" = success
          test "${{ needs.pyright.result }}" = success
